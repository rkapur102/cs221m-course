<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Prerendered HTML is the self-paced view. A returning enrolled visitor keeps the page
			// hidden until the app has switched views, so the wrong content never paints.
			try {
				if (localStorage.getItem('cs221m-view') === 'enrolled') {
					document.documentElement.dataset.view = 'enrolled';
					setTimeout(function () {
						document.documentElement.dataset.ready = '';
					}, 3000);
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
